# Manual, build-only workflow. Produces a public-Core AAB for internal Play Billing setup.
# No Plus runtime, no entitlement signing key, no upload to Google Play, no release.
name: "Prepare internal Play Billing AAB"

on:
  workflow_dispatch:
    inputs:
      upload_cert_sha256:
        description: "SHA-256 of Upload key certificate (Play Console > App integrity), not App signing certificate"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: internal-billing-aab
  cancel-in-progress: false

jobs:
  internal-aab:
    name: verify and build Play-uploadable internal AAB
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: google-play
    steps:
      # The workflow lives on default branch for workflow_dispatch, but always
      # builds the reviewed v5 release branch; never the main branch or a PR head.
      - uses: actions/checkout@v7.0.1
        with:
          ref: release/5.0.0-beta.1
          persist-credentials: false

      - name: Identify exact source
        run: |
          set -euo pipefail
          printf 'Source: %s\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          test -z "${LEVIX_EXTENSIONS_DIR:-}" || {
            echo "::error::Private extension injection is forbidden in this Free Core bootstrap build"
            exit 1
          }

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install pinned dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Gate on tests, lint and generated assets
        run: |
          set -euo pipefail
          npm test
          npm run lint
          npm run i18n:check
          npm run docs:check
          npm run build:frontend
        timeout-minutes: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/levix-android/node-runtime
            ~/.cache/levix-android/bin
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ runner.os }}-v2-${{ hashFiles('android/scripts/fetch-node-android.sh', 'android/scripts/build-ffmpeg-android.sh', 'android/scripts/termux-packages.lock', 'android/scripts/node-runtime.lock', 'android/scripts/node-runtime-archive.py', 'android/gradle/wrapper/gradle-wrapper.properties', 'package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: |
            android-${{ runner.os }}-v2-

      - name: Set up Android SDK (API 36) and FFmpeg NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager)"
          NDK_VERSION="$(sed -n 's/^NDK_VERSION="\(.*\)"$/\1/p' android/scripts/build-ffmpeg-android.sh)"
          [ -n "$NDK_VERSION" ] || { echo "::error::Missing pinned NDK version"; exit 1; }
          PACKAGES=()
          [ -d "$ANDROID_HOME/platforms/android-36" ] || PACKAGES+=("platforms;android-36")
          [ -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ] || PACKAGES+=("ndk;$NDK_VERSION")
          if [ "${#PACKAGES[@]}" -gt 0 ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            "$SDKMANAGER" "${PACKAGES[@]}"
          fi
          command -v pkg-config >/dev/null || sudo apt-get install -y pkg-config

      - name: Fetch pinned Android Node runtimes and FFmpeg
        run: bash android/scripts/fetch-node-android.sh
        timeout-minutes: 35

      - name: Load real Google Play upload keystore
        env:
          UPLOAD_KEY_B64: ${{ secrets.LEVIX_KEYSTORE_BASE64 }}
          LEVIX_KEYSTORE_PASSWORD: ${{ secrets.LEVIX_KEYSTORE_PASSWORD }}
          LEVIX_KEY_ALIAS: ${{ secrets.LEVIX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          [ -n "$UPLOAD_KEY_B64" ] && [ -n "$LEVIX_KEYSTORE_PASSWORD" ] && [ -n "$LEVIX_KEY_ALIAS" ] || {
            echo "::error::Google Play upload keystore/password/alias secrets missing"; exit 1;
          }
          umask 077
          printf '%s' "$UPLOAD_KEY_B64" | base64 --decode > "$RUNNER_TEMP/levix-upload.jks"
          [ -s "$RUNNER_TEMP/levix-upload.jks" ] || exit 1
          echo "LEVIX_KEYSTORE_FILE=$RUNNER_TEMP/levix-upload.jks" >> "$GITHUB_ENV"

      - name: Confirm this keystore matches Play Console Upload certificate
        env:
          LEVIX_KEYSTORE_PASSWORD: ${{ secrets.LEVIX_KEYSTORE_PASSWORD }}
          LEVIX_KEY_ALIAS: ${{ secrets.LEVIX_KEY_ALIAS }}
          EXPECTED_FINGERPRINT: ${{ inputs.upload_cert_sha256 }}
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          [[ "$expected" =~ ^[0-9A-F]{64}$ ]] || { echo "::error::Invalid SHA256 fingerprint"; exit 1; }
          actual="$(keytool -exportcert -keystore "$LEVIX_KEYSTORE_FILE" -storepass:env LEVIX_KEYSTORE_PASSWORD -alias "$LEVIX_KEY_ALIAS" | sha256sum | awk '{print toupper($1)}')"
          [ "$actual" = "$expected" ] || {
            echo "::error::Upload certificate mismatch: use Play Console Upload key certificate, not App signing key"; exit 1;
          }
          echo "Upload certificate fingerprint: MATCH" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed Free Core AAB with Google Play Billing
        working-directory: android
        env:
          LEVIX_KEYSTORE_PASSWORD: ${{ secrets.LEVIX_KEYSTORE_PASSWORD }}
          LEVIX_KEY_ALIAS: ${{ secrets.LEVIX_KEY_ALIAS }}
          LEVIX_KEY_PASSWORD: ${{ secrets.LEVIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unset LEVIX_EXTENSIONS_DIR
          ./gradlew :app:testDebugUnitTest :app:stageLevixBundle --stacktrace
          unzip -t app/build/outputs/bundle/release/levix-android.aab >/dev/null
          jarsigner -verify app/build/outputs/bundle/release/levix-android.aab
          sha256sum app/build/outputs/bundle/release/levix-android.aab | tee "$RUNNER_TEMP/levix-aab-sha256.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: levix-internal-play-billing-aab
          path: |
            android/app/build/outputs/bundle/release/levix-android.aab
            ${{ runner.temp }}/levix-aab-sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/levix-upload.jks"
