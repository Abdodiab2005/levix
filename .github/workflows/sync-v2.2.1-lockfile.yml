name: sync v2.2.1 lockfile

on:
  push:
    branches: ["ops/sync-v2.2.1-lockfile"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ops/sync-v2.2.1-lockfile
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Sync root lockfile version only
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (pkg.version !== '2.2.1') throw new Error(`expected package.json 2.2.1, got ${pkg.version}`);
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = pkg.version;
          if (!lock.packages?.['']) throw new Error('package-lock root package is missing');
          lock.packages[''].version = pkg.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE

          node -e "const p=require('./package-lock.json'); if(p.version!=='2.2.1'||p.packages[''].version!=='2.2.1') process.exit(1)"

          git rm .github/workflows/sync-v2.2.1-lockfile.yml
          git add package-lock.json

          # The helper workflow deletes itself, so the branch's final diff from
          # main contains only the lockfile metadata correction.
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: sync lockfile for v2.2.1"
          git push origin HEAD:ops/sync-v2.2.1-lockfile
