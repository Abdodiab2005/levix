name: audit-v201-dependencies

on:
  push:
    branches:
      - fix/v2.0.1-browser-origin-packages

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Runtime audit
        run: npm audit --omit=dev || true
      - name: Full audit
        run: npm audit || true
