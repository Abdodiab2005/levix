# Everything a tagged release produces: an npm package, a container image, one
# executable per platform, the public installer, and a checksum file covering
# exactly those files.
#
# Nothing is published unless the tag matches package.json and the full CI suite
# passes first.
#
#   tag pushed
#     └─ verify-version ── ci ── npm
#                          ├── image
#                          └── binaries ── publish-release ── installer
#
# Secrets: NPM_TOKEN, and the LEVIX_DEPLOY_* set on the installer-production
# environment. The container image uses the built-in GITHUB_TOKEN.

name: release

on:
  push:
    tags: ["v*"]

jobs:
  verify-version:
    name: tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify release tag and npm package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          package_name="$(node -p "require('./package.json').name")"

          if [ "$tag" != "$package_version" ]; then
            echo "::error::Release tag v${tag} does not match package.json version ${package_version}"
            exit 1
          fi

          if [ "$package_name" != "levix-bot" ]; then
            echo "::error::Unexpected npm package name: ${package_name} (expected levix-bot)"
            exit 1
          fi

          echo "Release verified: ${package_name}@${package_version}"

  # The same jobs a pull request runs. A release that would fail CI is not a
  # release.
  ci:
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  npm:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/abdodiab2005/levix
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: image-tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

  binaries:
    needs: ci
    # A single executable embeds the host's node binary, so each platform has
    # to be built on itself.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: levix-linux-x64
            file: build/levix
          - os: macos-latest
            asset: levix-macos-arm64
            file: build/levix
          - os: windows-latest
            asset: levix-windows-x64.exe
            file: build/levix.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:sea
      # Ship nothing that hasn't been started at least once.
      - run: npm run validate:sea
        timeout-minutes: 20
      - name: Name it after the platform
        shell: bash
        run: mv "${{ matrix.file }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          pattern: levix-*
          path: dist
          merge-multiple: true

      # deploy/install.sh with the version pinned to this release. The same
      # bytes become the release asset and the file published at
      # levix.leviro.net — generated once, here, from the commit being released.
      - name: Generate the installer for this release
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/build-release-installer.mjs "$TAG"

      - name: Checksum the artifacts
        working-directory: dist
        run: |
          set -e
          ls -1
          sha256sum levix-* > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/levix-*-install.sh

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            Linux server:

            ```
            curl -fsSL https://levix.leviro.net/install.sh | bash
            ```

            Or with npm (Node.js 24+):

            ```
            npm install -g levix-bot
            levix
            ```

            The npm package is `levix-bot`; the CLI command is `levix`.

            To stay on this exact version:

            ```
            curl -fsSL https://levix.leviro.net/install/${{ github.ref_name }}.sh | bash
            ```

            ## Verifying a download

            ```
            sha256sum -c SHA256SUMS.txt
            ```

            Each binary carries its own Node and its own SQLite. It does not
            carry ffmpeg — install it, or point Settings → Media at one, if you
            want video thumbnails.

  installer:
    name: publish the public installer
    needs: [publish-release, npm]
    runs-on: ubuntu-latest
    environment: installer-production
    concurrency:
      group: levix-installer-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist

      - name: Read the release tag
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/build-release-installer.mjs --print "$TAG" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Check the shell
        run: |
          set -e
          shellcheck deploy/install.sh scripts/publish-installer.sh scripts/deploy-installer.sh
          bash -n "dist/levix-${{ steps.release.outputs.tag }}-install.sh"

      - name: Deploy
        env:
          LEVIX_DEPLOY_HOST: ${{ secrets.LEVIX_DEPLOY_HOST }}
          LEVIX_DEPLOY_USER: ${{ secrets.LEVIX_DEPLOY_USER }}
          LEVIX_DEPLOY_PORT: ${{ secrets.LEVIX_DEPLOY_PORT }}
          LEVIX_DEPLOY_SSH_KEY: ${{ secrets.LEVIX_DEPLOY_SSH_KEY }}
          LEVIX_DEPLOY_KNOWN_HOSTS: ${{ secrets.LEVIX_DEPLOY_KNOWN_HOSTS }}
          LEVIX_DEPLOY_ROOT: ${{ secrets.LEVIX_DEPLOY_ROOT }}
        run: |
          bash scripts/deploy-installer.sh \
            "dist/levix-${{ steps.release.outputs.tag }}-install.sh" \
            "${{ steps.release.outputs.version }}" \
            "${{ steps.release.outputs.stable }}"

      - name: What was published
        run: |
          echo "### Public installer" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`/install/${{ steps.release.outputs.tag }}.sh\` published" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.release.outputs.stable }}" = "yes" ]; then
            echo "- \`/install.sh\` now installs ${{ steps.release.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`/install.sh\` left alone (prerelease)" >> "$GITHUB_STEP_SUMMARY"
          fi
