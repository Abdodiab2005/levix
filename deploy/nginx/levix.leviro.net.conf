# Reference Nginx configuration for the Levix download host.
#
# This file is documentation, not something Levix installs. Copy the parts you
# need into the server block that already serves levix.leviro.net.
#
# Two things live on that hostname:
#
#   /install.sh, /install, /install/*   static files, published by a release
#   everything else                      the Next.js site, on 127.0.0.1:3000
#
# The installers are plain files on disk. Publishing a release replaces one of
# them with a rename; nothing here needs a reload, a restart, or an Nginx that
# knows anything about releases.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name levix.leviro.net;

    # ssl_certificate / ssl_certificate_key — whatever certbot or your existing
    # setup already wrote for this host.

    charset utf-8;

    # `location =` is an exact match and Nginx settles it before it looks at
    # anything else, so this can never fall through to the proxy below.
    location = /install.sh {
        alias /var/www/levix-downloads/install.sh;

        # Readable in a browser. Anyone about to pipe this into a shell should
        # be able to click the URL and read it first — that is the whole point
        # of publishing the source rather than a binary.
        default_type text/plain;
        add_header Content-Disposition "inline" always;

        # A moving alias. Serving yesterday's stable installer from a cache
        # after a release is the one failure this endpoint must not have.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Convenience only. The command in the documentation stays /install.sh.
    location = /install {
        return 302 /install.sh;
    }

    # `^~` stops Nginx from considering any regex location for these, so a
    # future regex rule for the site cannot start swallowing installer URLs.
    location ^~ /install/ {
        alias /var/www/levix-downloads/install/;

        default_type text/plain;
        add_header Content-Disposition "inline" always;

        # These files are immutable: v2.0.1.sh is written once and never
        # rewritten, so it can be cached for as long as anyone likes.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        autoindex off;
    }

    # Everything else is the website, which knows nothing about any of this.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# For the Upgrade header above, if the site does not already define it:
#
#   map $http_upgrade $connection_upgrade {
#       default upgrade;
#       ''      close;
#   }
